<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ConjuTrain - French Verb Conjugation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#1a1a2e;--c2:#16213e;--c3:#0f3460;--acc:#e94560;--gold:#f5a623;--light:#f8f5f0;--muted:#8a8a9a;--card:#ffffff;--border:#e8e4df;--green:#2d9e6b;--red:#e94560}
body{font-family:'DM Sans',sans-serif;background:var(--light);color:var(--c1);min-height:100vh}
@media(prefers-color-scheme:dark){:root{--light:#141420;--card:#1e1e30;--border:#2e2e45;--c1:#f0eee8;--muted:#7a7a9a}}

.app{max-width:760px;margin:0 auto;padding:1.5rem 1rem}
@media(max-width:480px){
.app{padding:1rem .75rem}
.header h1{font-size:1.5rem}
.header p{font-size:11px}
.question-card{padding:1rem}
.verb-name{font-size:1.6rem}
.tense-badge{font-size:10px;padding:2px 8px}
.person-grid{display:grid !important;grid-template-columns:1fr !important;gap:8px !important}
.person-row{padding:10px 14px;gap:12px}
.person-label{min-width:44px;font-size:13px}
.person-input{font-size:16px;padding:6px 0}
.config-grid{grid-template-columns:1fr}
.tense-grid{gap:4px}
.tense-chip{font-size:11px;padding:6px 8px}
.progress-info{font-size:11px}
.action-row{flex-direction:column;gap:8px}
.action-row button{width:100%}
.check-btn,.skip-btn,.nav-btn{padding:14px}
.result-stats{grid-template-columns:1fr;gap:8px}
.result-score{font-size:2.5rem}
.save-btn,.again-btn{width:auto;margin:0 6px;flex:1}
.accent-bar{gap:3px;padding:6px}
.accent-btn{font-size:14px;padding:8px;min-width:36px;min-height:36px}
.participle-input{font-size:16px}
.hist-top{flex-direction:column;align-items:center;gap:4px;text-align:center}
.hist-score{font-size:16px}
}
.header{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.header h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;letter-spacing:-0.02em;color:var(--c1)}
.header p{font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}

.tabs{display:flex;gap:2px;background:var(--border);padding:3px;border-radius:10px;margin-bottom:1.5rem}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .2s}
.tab.active{background:var(--card);color:var(--c1);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.section-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}

.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.config-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.config-card .section-label{margin-bottom:.5rem}
.count-row{display:flex;align-items:center;gap:10px}
.count-row input[type=range]{flex:1}
.count-val{font-size:18px;font-weight:500;min-width:28px;text-align:right}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:1rem}

.tense-grid{display:flex;flex-wrap:wrap;gap:6px}
.verb-grid{display:flex;flex-wrap:wrap;gap:6px}
.verb-details{margin-top:.25rem}
.verb-details summary{font-size:12px;color:var(--c3);cursor:pointer;user-select:none;list-style:none;display:flex;align-items:center;gap:4px;padding:4px 0;width:fit-content}
.verb-details summary::-webkit-details-marker{display:none}
.verb-details summary::before{content:'▶';font-size:9px;transition:transform .2s;display:inline-block}
.verb-details[open] summary::before{transform:rotate(90deg)}
.verb-details[open] .verb-grid{margin-top:.5rem}
.section-label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem}
.select-all-btn{font-size:12px;padding:4px 10px;background:transparent;border:1px solid var(--c3);color:var(--c3);border-radius:6px;cursor:pointer;transition:all .2s}
.select-all-btn:hover{background:var(--c3);color:#fff}
.mode-grid{display:flex;gap:6px;margin-top:.5rem}
.mode-chip{flex:1;padding:8px;text-align:center;font-size:13px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:var(--card);color:var(--muted);transition:all .2s}
.mode-chip.on{background:var(--c3);color:#fff;border-color:var(--c3)}
.mode-config{margin-top:.5rem;padding:.5rem;background:var(--light);border-radius:8px;font-size:13px;color:var(--muted)}
.tense-chip{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);cursor:pointer;color:var(--muted);background:var(--card);transition:all .2s;user-select:none;min-width:60px;text-align:center}
.tense-chip.on{background:var(--c3);border-color:var(--c3);color:#fff;font-weight:500}

.start-btn{width:100%;padding:14px;background:var(--c3);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.start-btn:hover{background:var(--acc);transform:translateY(-1px)}

.progress-bar{background:var(--border);border-radius:4px;height:4px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--c3),var(--acc));border-radius:4px;transition:width .4s ease}
.timer-row{display:flex;align-items:center;gap:8px;margin-bottom:1rem;opacity:0}
.timer-row.active{opacity:1}
.timer-text{font-size:12px;color:var(--muted);min-width:32px}
.timer-bar{flex:1;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--c3),var(--acc));width:100%;transition:width .1s linear}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:.5rem}

.question-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem}
.verb-display{text-align:center;margin-bottom:1.5rem}
.verb-name{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:600;color:var(--c1);display:block}
.tense-badge{display:inline-block;background:var(--c3);color:#fff;font-size:11px;padding:3px 12px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;margin-top:.4rem}

.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person-row{display:flex;align-items:center;gap:8px;background:var(--light);border-radius:10px;padding:8px 10px;flex-wrap:nowrap}
.person-label{font-size:12px;font-weight:500;color:var(--muted);min-width:50px;letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.person-input{flex:1;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--c1);outline:none;min-width:0}
.person-input::placeholder{color:#bbb}
.person-row.correct{background:#f0faf5;border:1px solid #b7dfd0}
.person-row.wrong{background:#fff5f5;border:1px solid #f5c0c0}
.person-row.correct .person-label{color:var(--green)}
.person-row.wrong .person-label{color:var(--red)}
.answer-hint{font-size:11px;color:var(--red);display:none}
.person-row.wrong .answer-hint{display:block;color:var(--red)}

.action-row{display:flex;gap:10px;margin-top:1rem}
.check-btn{flex:1;padding:12px;background:var(--c1);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.check-btn:hover{background:var(--c3)}
.check-icon{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:10px}
.skip-btn{padding:12px 16px;background:transparent;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s}
.skip-btn:hover{border-color:var(--c3);color:var(--c3)}

.nav-btn{flex:1;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.nav-next{background:var(--acc);color:#fff;border:none}
.nav-next:hover{background:#d63a53}

.result-screen{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center}
.result-score{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:600;color:var(--c3);line-height:1}
.result-score.tier-perfect{color:var(--gold)}
.result-score.tier-great{color:var(--green)}
.result-score.tier-ok{color:var(--c3)}
.result-score.tier-low{color:var(--red)}
.result-message{font-size:15px;margin-top:.6rem;font-weight:500}
.result-label{font-size:13px;color:var(--muted);margin-top:.3rem;letter-spacing:.04em;text-transform:uppercase}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1.5rem 0}
.stat-card{background:var(--light);border-radius:10px;padding:1rem;text-align:center}
.stat-val{font-size:1.4rem;font-weight:500;color:var(--c1)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.save-btn{padding:12px 28px;background:#55756e;color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin:0 6px;transition:all .2s}
.save-btn:hover{transform:translateY(-1px);background:#4a6660}
.again-btn{padding:12px 28px;background:var(--c3);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin:0 6px;transition:all .2s}
.again-btn:hover{background:var(--acc)}

.history-list{display:flex;flex-direction:column;gap:10px}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:all .2s}
.hist-card:hover{border-color:var(--c3)}
.hist-top{display:flex;justify-content:space-between;align-items:center}
.hist-date{font-size:12px;color:var(--muted)}
.hist-score{font-size:18px;font-weight:500;color:var(--c3)}
.hist-detail{margin-top:.6rem;font-size:12px;color:var(--muted)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}
.hist-delete{opacity:0;transition:opacity .2s;padding:4px 8px;font-size:12px;color:var(--red);cursor:pointer;border:none;background:none;border-radius:6px}
.hist-card:hover .hist-delete{opacity:1}
.hist-delete:hover{background:rgba(255,0,0,.05)}

.detail-panel{background:var(--light);border-radius:10px;padding:1rem;margin-top:.8rem;display:none;font-size:12px}
.detail-panel.open{display:block}
.detail-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
.detail-item:last-child{border:none}
.di-info{color:var(--muted)}
.di-res{font-weight:500}
.di-res.ok{color:var(--green)}
.di-res.err{color:var(--red)}
.di-person-list{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.di-person-row{display:flex;gap:6px;font-size:11px;padding:2px 6px;border-radius:4px}
.di-person-row.ok{background:#f0faf5;color:var(--green)}
.di-person-row.err{background:#fff5f5}
.di-person-label{color:var(--muted);min-width:56px;flex-shrink:0}
.di-person-user{flex:1}
.di-person-user.wrong{color:var(--red);text-decoration:line-through}
.di-person-correct{color:var(--green);margin-left:4px}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);background:var(--c1);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .4s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.accent-bar{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:1rem;padding:8px;background:var(--light);border-radius:10px}
.accent-btn{font-size:16px;padding:6px 10px;background:var(--card);border:1px solid var(--border);border-radius:6px;cursor:pointer;color:var(--c1);transition:all .15s;min-width:36px;text-align:center;-webkit-appearance:none}
.accent-btn:hover,.accent-btn:active{background:var(--c3);color:#fff;border-color:var(--c3)}
.accent-btn.selected{background:var(--c3);color:#fff;border-color:var(--c3);box-shadow:0 0 0 2px rgba(15,52,96,.3)}

/* Sub-tabs inside history */
.sub-tabs{display:flex;gap:2px;background:var(--border);padding:2px;border-radius:8px;margin-bottom:1rem}
.sub-tab{flex:1;padding:6px;text-align:center;font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;color:var(--muted);transition:all .2s}
.sub-tab.active{background:var(--card);color:var(--c1);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Mistake book */
.mistake-summary{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:1rem}
.mistake-summary-text{font-size:13px;color:var(--muted)}
.mistake-summary-text strong{color:var(--c1)}
.mistake-practice-btn{padding:7px 14px;background:var(--c3);color:#fff;border:none;border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;white-space:nowrap}
.mistake-practice-btn:hover{background:var(--acc)}
.mistake-verb-group{margin-bottom:.75rem}
.mistake-verb-name{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--c1);padding:.4rem 0 .25rem;border-bottom:1px solid var(--border);margin-bottom:.35rem}
.mistake-tense-row{display:flex;justify-content:space-between;align-items:center;padding:5px 4px;font-size:13px}
.mistake-tense-name{color:var(--muted)}
.mistake-status{font-size:11px;font-weight:600;letter-spacing:.04em}
.mistake-status.todo{color:var(--red)}
.mistake-status.learning{color:#d4820a}
.mistake-status.mastered{color:var(--green)}

/* Result retry button */
.retry-btn{padding:12px 20px;background:var(--light);color:var(--c1);border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.retry-btn:hover{border-color:var(--acc);color:var(--acc)}

.participle-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0}
.participle-input{font-family:'DM Sans',sans-serif;font-size:18px;color:var(--c1);border:none;border-bottom:2px solid var(--c3);background:transparent;outline:none;text-align:center;width:120px;padding:4px 8px;-webkit-appearance:none}
.participle-input::placeholder{color:#bbb}
</style>

<div class="app">
<div class="header">
  <h1>Conjugaison française</h1>
  <p>Entraînement aux conjugaisons</p>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('practice')">练习</div>
  <div class="tab" onclick="switchTab('history')">历史记录</div>
</div>

<div id="tab-practice">
  <div id="config-screen">
    <div class="config-grid">
      <div class="config-card">
        <div class="section-label">题目数量</div>
        <div class="count-row">
          <input type="range" min="3" max="20" value="8" step="1" id="count-slider" oninput="document.getElementById('count-val').textContent=this.value">
          <span class="count-val" id="count-val">8</span>
        </div>
      </div>
      <div class="config-card">
        <div class="section-label">选择时态</div>
        <div class="tense-grid" id="tense-chips"></div>
      </div>
      <div class="config-card">
        <div class="section-label-row">
          <span class="section-label">选择动词</span>
          <button class="select-all-btn" onclick="toggleAllVerbs()">全选/取消</button>
        </div>
        <details class="verb-details" open>
          <summary id="verb-summary">收起</summary>
          <div class="verb-grid" id="verb-chips"></div>
        </details>
      </div>
      <div class="config-card">
        <div class="section-label">练习模式</div>
        <div class="mode-grid" id="mode-chips">
          <button class="mode-chip on" data-mode="random">随机</button>
          <button class="mode-chip" data-mode="timed">限时</button>
        </div>
        <div class="mode-config" id="mode-config" style="display:none">
          <label>每题限时：</label>
          <input type="range" min="10" max="120" value="30" step="10" id="time-slider" oninput="document.getElementById('time-val').textContent=this.value">
          <span id="time-val">30</span>秒
        </div>
      </div>
    </div>
    <button class="start-btn" onclick="startSession()">开始练习 →</button>
  </div>

  <div id="quiz-screen" style="display:none">
    <div class="progress-info">
      <span id="prog-label">第 1 题，共 8 题</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div class="timer-row" id="timer-row" style="display:none">
      <span class="timer-text" id="timer-text">30秒</span>
      <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    </div>
    <div id="question-area"></div>
  </div>

  <div id="result-screen" style="display:none"></div>
</div>

<div id="tab-history" style="display:none">
  <div class="sub-tabs">
    <div class="sub-tab active" onclick="switchSubTab('mistakes')">错题本</div>
    <div class="sub-tab" onclick="switchSubTab('records')">练习记录</div>
  </div>
  <div id="sub-mistakes"></div>
  <div id="sub-records" style="display:none"><div class="history-list" id="history-list"></div></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const PERSONS = ['Je','Tu','Il/Elle','Nous','Vous','Ils/Elles'];
const TENSES = ['Présent','Imparfait','Passé simple','Subjonctif','Conditionnel','Participe passé','Participe présent'];

let activeTenses = new Set(['Présent','Imparfait','Conditionnel']);
let activeVerbs = new Set();
let currentMode = 'random';
let timeLimit = 30;
let session = {questions:[], current:0, checked:false, results:[], startTime:Date.now(), endTime:0};
let timerState = {interval:null, remaining:0};
let historyDirty = true; // tracks whether history tab needs re-render

function computeMistakeBook(){
  // Replay history chronologically to compute correctStreak per verb||tense
  const history = JSON.parse(localStorage.getItem('frVerb_history')||'[]');
  const sorted = [...history].sort((a,b)=>(a.ts||0)-(b.ts||0));
  const map = {}; // key -> {wrongCount, streak}
  sorted.forEach(rec=>{
    (rec.results||[]).filter(Boolean).forEach(r=>{
      if(r.skipped) return;
      const key = `${r.verb}||${r.tense}`;
      if(!map[key]) map[key]={wrongCount:0,streak:0};
      if(r.allRight){
        map[key].streak++;
      } else {
        map[key].wrongCount++;
        map[key].streak=0;
      }
    });
  });
  // Build entries: only keep items that were ever wrong
  const entries = [];
  Object.keys(map).forEach(key=>{
    const m = map[key];
    if(m.wrongCount === 0) return; // never wrong, skip
    const [verb,tense] = key.split('||');
    if(!DB[verb]||!DB[verb][tense]) return;
    let status;
    if(m.streak >= 2) status='mastered';
    else if(m.streak === 1) status='learning';
    else status='todo';
    entries.push({verb,tense,status,key});
  });
  return entries;
}

function renderMistakeBook(){
  const container = document.getElementById('sub-mistakes');
  const entries = computeMistakeBook();

  if(!entries.length){
    container.innerHTML='<div class="empty-state">暂无错题记录。完成练习并保存后，错题将在此显示。</div>';
    return;
  }

  const todo = entries.filter(e=>e.status==='todo').length;
  const learning = entries.filter(e=>e.status==='learning').length;
  const mastered = entries.filter(e=>e.status==='mastered').length;
  const pending = todo + learning;

  // Group by verb alphabetically
  const byVerb = {};
  entries.forEach(e=>{
    if(!byVerb[e.verb]) byVerb[e.verb]=[];
    byVerb[e.verb].push(e);
  });
  const verbsSorted = Object.keys(byVerb).sort();

  const statusLabel = {
    todo:'待复习', learning:'加强中', mastered:'已掌握'
  };
  const statusClass = {
    todo:'todo', learning:'learning', mastered:'mastered'
  };

  const groups = verbsSorted.map(verb=>{
    const rows = byVerb[verb].map(e=>`
      <div class="mistake-tense-row">
        <span class="mistake-tense-name">${e.tense}</span>
        <span class="mistake-status ${statusClass[e.status]}">${statusLabel[e.status]}</span>
      </div>`).join('');
    return `<div class="mistake-verb-group">
      <div class="mistake-verb-name">${verb}</div>
      ${rows}
    </div>`;
  }).join('');

  // Practice pool: todo + learning items only
  const practicePool = entries
    .filter(e=>e.status!=='mastered')
    .map(e=>({verb:e.verb, tense:e.tense, forms:DB[e.verb][e.tense]}));

  container.innerHTML = `
    <div class="mistake-summary">
      <span class="mistake-summary-text">
        待复习 <strong>${todo}</strong> · 加强中 <strong>${learning}</strong> · 已掌握 <strong>${mastered}</strong>
      </span>
      ${pending ? `<button class="mistake-practice-btn" id="mistake-practice-btn">练习待复习 (${pending})</button>` : ''}
    </div>
    ${groups}`;

  if(pending){
    document.getElementById('mistake-practice-btn').onclick = ()=>startSession(shuffle(practicePool));
  }
}

function switchSubTab(t){
  document.querySelectorAll('.sub-tab').forEach((el,i)=>{
    el.classList.toggle('active',['mistakes','records'][i]===t);
  });
  document.getElementById('sub-mistakes').style.display = t==='mistakes'?'':'none';
  document.getElementById('sub-records').style.display = t==='records'?'':'none';
  if(t==='mistakes') renderMistakeBook();
}

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',['practice','history'][i]===t)});
  document.getElementById('tab-practice').style.display = t==='practice'?'':'none';
  document.getElementById('tab-history').style.display = t==='history'?'':'none';
  if(t==='history'){
    // Always re-render mistake book when switching to history; records only if dirty
    renderMistakeBook();
    if(historyDirty){
      renderHistory();
      historyDirty = false;
    }
  }
}

function initVerbs(){
  const saved = localStorage.getItem('frVerb_activeVerbs');
  const allVerbs = Object.keys(DB);
  if(saved){
    activeVerbs = new Set(JSON.parse(saved));
  } else {
    activeVerbs = new Set(allVerbs);
    localStorage.setItem('frVerb_activeVerbs', JSON.stringify(allVerbs));
  }
  const c = document.getElementById('verb-chips');
  c.innerHTML = '';
  allVerbs.forEach(verb=>{
    const el = document.createElement('button');
    el.className = 'tense-chip' + (activeVerbs.has(verb) ? ' on' : '');
    el.textContent = verb;
    el.onclick = ()=>{
      if(activeVerbs.has(verb)){
        if(activeVerbs.size>1) activeVerbs.delete(verb);
      } else {
        activeVerbs.add(verb);
      }
      el.classList.toggle('on', activeVerbs.has(verb));
      localStorage.setItem('frVerb_activeVerbs', JSON.stringify([...activeVerbs]));
    };
    c.appendChild(el);
  });
  // Update summary text on toggle
  const details = document.querySelector('.verb-details');
  const summary = document.getElementById('verb-summary');
  if(details && summary){
    const updateSummary = ()=>{ summary.textContent = details.open ? '收起动词列表' : `展开动词列表（${activeVerbs.size}/${Object.keys(DB).length} 已选）`; };
    updateSummary();
    details.removeEventListener('toggle', details._toggleHandler);
    details._toggleHandler = updateSummary;
    details.addEventListener('toggle', details._toggleHandler);
  }
}

function toggleAllVerbs(){
  const allVerbs = Object.keys(DB);
  const allSelected = activeVerbs.size === allVerbs.length;
  if(allSelected){
    activeVerbs = new Set([allVerbs[0]]);
  } else {
    activeVerbs = new Set(allVerbs);
  }
  localStorage.setItem('frVerb_activeVerbs', JSON.stringify([...activeVerbs]));
  initVerbs();
}

function initModes(){
  document.querySelectorAll('.mode-chip').forEach(el=>{
    el.onclick = ()=>{
      document.querySelectorAll('.mode-chip').forEach(e=>e.classList.remove('on'));
      el.classList.add('on');
      currentMode = el.dataset.mode;
      document.getElementById('mode-config').style.display = currentMode === 'timed' ? '' : 'none';
    };
  });
}

function initChips(){
  const saved = localStorage.getItem('frVerb_activeTenses');
  if(saved){
    try{ activeTenses = new Set(JSON.parse(saved)); }catch(e){}
  }
  const c = document.getElementById('tense-chips');
  TENSES.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'tense-chip'+(activeTenses.has(t)?' on':'');
    el.textContent = TENSE_SHORT[t]||t;
    el.title = t;
    el.onclick = ()=>{
      if(activeTenses.has(t)){if(activeTenses.size>1)activeTenses.delete(t);}
      else activeTenses.add(t);
      el.classList.toggle('on', activeTenses.has(t));
      localStorage.setItem('frVerb_activeTenses', JSON.stringify([...activeTenses]));
    };
    c.appendChild(el);
  });
}

function buildPool(){
  const pool = [];
  Object.keys(DB).forEach(verb=>{
    if(!activeVerbs.has(verb)) return;
    activeTenses.forEach(tense=>{
      if(DB[verb][tense]){
        const forms = DB[verb][tense];
        if(forms.some(f=>f)) pool.push({verb, tense, forms});
      }
    });
  });
  return pool;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startSession(customPool){
  const n = parseInt(document.getElementById('count-slider').value);
  timeLimit = parseInt(document.getElementById('time-slider').value);
  const pool = customPool ? customPool : shuffle(buildPool()).slice(0, n);
  if(!pool.length){showToast('请至少选择一个时态！');return;}
  session = {questions:pool, current:0, checked:false, results:[], startTime:Date.now(), endTime:0};
  document.getElementById('config-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='';
  document.getElementById('result-screen').style.display='none';
  if(document.getElementById('tab-history').style.display !== 'none') switchTab('practice');
  renderQuestion();
}

const ACCENT_CHARS = ['à','â','ç','é','è','ê','ë','î','ï','ô','œ','ù','û','ü'];

function startTimer(){
  clearInterval(timerState.interval);
  if(currentMode !== 'timed') return;
  const total = timeLimit * 1000;
  timerState.remaining = total;
  const timerRow = document.getElementById('timer-row');
  const timerText = document.getElementById('timer-text');
  const timerFill = document.getElementById('timer-fill');
  timerRow.style.display = '';
  timerRow.classList.add('active');
  timerText.textContent = timeLimit + '秒';
  timerFill.style.width = '100%';
  const startTime = Date.now();
  timerState.interval = setInterval(()=>{
    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, total - elapsed);
    timerState.remaining = remaining;
    timerFill.style.width = (remaining/total*100) + '%';
    timerText.textContent = Math.ceil(remaining/1000) + '秒';
    if(remaining <= 0){
      clearInterval(timerState.interval);
      session.results[session.current] = {verb:session.questions[session.current].verb,tense:session.questions[session.current].tense,allRight:false,skipped:true};
      showToast('时间到！');
      nextQuestion();
    }
  }, 100);
}

function renderQuestion(){
  setAccentMode(false);
  if(currentMode === 'timed') startTimer();
  const q = session.questions[session.current];
  const total = session.questions.length;
  const pct = Math.round(session.current/total*100);
  document.getElementById('prog-label').textContent = `第 ${session.current+1} 题，共 ${total} 题`;
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
  session.checked = false;

  const isPP = (q.tense==='Participe passé'||q.tense==='Participe présent');
  const accentBar = `<div class="accent-bar" id="accent-bar">${ACCENT_CHARS.map(c=>`<button class="accent-btn" type="button" data-accent="${c}">${c}</button>`).join('')}</div>`;

  const inputArea = isPP ? `
    <div class="participle-row">
      <input class="participle-input" id="inp-0" placeholder="..." autocomplete="off" autocorrect="off" spellcheck="false">
    </div>` :
    `<div class="person-grid">${[0,1,2,3,4,5].map(i=>`
      <div class="person-row" id="row-${i}">
        <span class="person-label">${PERSONS[i]}</span>
        <input class="person-input" id="inp-${i}" placeholder="..." autocomplete="off" autocorrect="off" spellcheck="false">
        <span class="answer-hint" id="hint-${i}"></span>
      </div>`).join('')}</div>`;

  document.getElementById('question-area').innerHTML = `
    <div class="question-card">
      <div class="verb-display">
        <span class="verb-name">${q.verb}</span>
        <span class="tense-badge">${q.tense}</span>
      </div>
      ${accentBar}
      ${inputArea}
      <div class="action-row">
        <button class="check-btn" onclick="checkAnswers()">
          <span class="check-icon">✓</span> 核对答案
        </button>
        <button class="skip-btn" onclick="nextQuestion()">跳过 →</button>
      </div>
    </div>`;
  document.getElementById('inp-0')?.focus();
}

function normalize(s){return (s||'').trim().toLowerCase();}

function checkAnswers(){
  const q = session.questions[session.current];
  const isPP = (q.tense==='Participe passé'||q.tense==='Participe présent');
  let allRight = true;
  const personResults = [];

  if(isPP){
    const inp = document.getElementById('inp-0');
    const expected = q.forms[0];
    const val = inp ? inp.value : '';
    const ok = normalize(val) === normalize(expected);
    inp.classList.toggle('correct', ok);
    inp.style.borderColor = ok ? 'var(--green)' : 'var(--red)';
    if(!ok && expected) showToast(`✗ 正确答案：${expected}`);
    if(!ok) allRight = false;
    personResults.push({i:0, ok, userAns:val, correct:expected, person:'Participe'});
  } else {
    [0,1,2,3,4,5].forEach(i=>{
      const inp = document.getElementById('inp-'+i);
      const row = document.getElementById('row-'+i);
      const hint = document.getElementById('hint-'+i);
      const expected = q.forms[i];
      if(!expected){row.classList.remove('correct','wrong');personResults.push({i,ok:true,ans:''});return;}
      const val = inp?inp.value:'';
      const ok = normalize(val)===normalize(expected);
      row.classList.toggle('correct',ok);
      row.classList.toggle('wrong',!ok);
      if(hint) hint.textContent = ok ? '' : `✗ 正确答案：${expected}`;
      if(!ok) allRight = false;
      personResults.push({i, ok, userAns:val, correct:expected, person:PERSONS[i]});
    });
  }

  session.checked = true;

  const actionRow = document.querySelector('.action-row');
  actionRow.innerHTML = `
    <button class="nav-btn nav-next" onclick="nextQuestion()">
      ${session.current+1 < session.questions.length ? '下一题 →' : '查看结果 →'}
    </button>`;

  if(allRight) showToast('全部正确！');
  session.results[session.current] = {verb:q.verb, tense:q.tense, allRight, personResults};
}

function nextQuestion(){
  clearInterval(timerState.interval);
  if(!session.checked){
    const q = session.questions[session.current];
    session.results[session.current] = {verb:q.verb, tense:q.tense, allRight:false, skipped:true};
  }
  session.current++;
  if(session.current >= session.questions.length){showResult();return;}
  renderQuestion();
}

function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  session.endTime = Date.now();
  const rs = document.getElementById('result-screen');
  rs.style.display='';
  const correct = session.results.filter(r=>r&&r.allRight).length;
  const total = session.questions.length;
  const pct = Math.round(correct/total*100);

  let tier, emoji, message;
  if(pct === 100){
    tier='tier-perfect'; emoji='🏆'; message='满分！完美无缺！';
  } else if(pct >= 80){
    tier='tier-great'; emoji='✨'; message='掌握得很好，继续保持！';
  } else if(pct >= 60){
    tier='tier-ok'; emoji='📖'; message='还不错，还有提升空间。';
  } else {
    tier='tier-low'; emoji='💪'; message='加油！多练几遍就好了。';
  }

  // Build retry-mistakes pool from this session's wrong answers
  const wrongItems = session.results.filter(r=>r&&!r.allRight&&!r.skipped);
  const retryPool = wrongItems.map(r=>{
    if(DB[r.verb]&&DB[r.verb][r.tense]) return {verb:r.verb,tense:r.tense,forms:DB[r.verb][r.tense]};
    return null;
  }).filter(Boolean);

  rs.innerHTML = `
    <div class="result-screen">
      <div class="result-score ${tier}">${emoji} ${pct}%</div>
      <div class="result-message">${message}</div>
      <div class="result-label" style="margin-top:.25rem">正确率</div>
      <div class="result-stats">
        <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">总题数</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--green)">${correct}</div><div class="stat-lbl">全对</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--red)">${total-correct}</div><div class="stat-lbl">出错</div></div>
      </div>
      <div class="result-actions">
        <button class="save-btn" onclick="saveSession()">保存练习</button>
        <button class="again-btn" onclick="resetToConfig()">再练一次</button>
      </div>
      ${retryPool.length ? `<div style="margin-top:.75rem;text-align:center"><button class="retry-btn" id="retry-mistakes-btn">练本次错题 (${retryPool.length} 题)</button></div>` : ''}
    </div>`;

  // Attach retry handler after DOM insertion (avoids JSON escaping issues)
  if(retryPool.length){
    document.getElementById('retry-mistakes-btn').onclick = ()=>startSession(retryPool);
  }
}

function saveSession(){
  const history = JSON.parse(localStorage.getItem('frVerb_history')||'[]');
  const rec = {
    date: new Date().toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    ts: Date.now(),
    total: session.questions.length,
    correct: session.results.filter(r=>r&&r.allRight).length,
    tenses: [...activeTenses],
    results: session.results,
    mode: currentMode,
    timeLimit: timeLimit,
    duration: session.endTime - session.startTime
  };
  history.unshift(rec);
  localStorage.setItem('frVerb_history', JSON.stringify(history.slice(0,50)));
  historyDirty = true;
  showToast('已保存！');
}

function resetToConfig(){
  document.getElementById('config-screen').style.display='';
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
}

function renderHistory(){
  const list = document.getElementById('history-list');
  const history = JSON.parse(localStorage.getItem('frVerb_history')||'[]');
  if(!history.length){list.innerHTML='<div class="empty-state">暂无练习记录</div>';return;}
  list.innerHTML = history.map((rec,idx)=>{
    const pct = Math.round(rec.correct/rec.total*100);
    const modeNames = {random:'随机', timed:'限时'};
    const modeStr = modeNames[rec.mode] || '';
    const tenseStr = (rec.tenses||[]).map(t=>TENSE_SHORT[t]||t).join(' - ');
    const durationStr = rec.mode === 'timed' && rec.duration ? `${(rec.duration/1000).toFixed(1)}s/${rec.timeLimit*rec.total}s` : '';

    const detailRows = (rec.results||[]).filter(Boolean).map(r=>{
      const statusClass = r.allRight ? 'ok' : 'err';
      const statusText = r.allRight ? '✓ 全对' : r.skipped ? '跳过' : '✗ 出错';

      // Build per-person answer breakdown for wrong/skipped items
      let personDetail = '';
      if(!r.allRight && !r.skipped && r.personResults){
        const rows = r.personResults.filter(p=>p.correct).map(p=>{
          const isOk = p.ok;
          const userText = p.userAns || '（空）';
          return `<div class="di-person-row ${isOk?'ok':'err'}">
            <span class="di-person-label">${p.person}</span>
            <span class="di-person-user ${isOk?'':'wrong'}">${userText}</span>
            ${!isOk ? `<span class="di-person-correct">→ ${p.correct}</span>` : ''}
          </div>`;
        }).join('');
        if(rows) personDetail = `<div class="di-person-list">${rows}</div>`;
      }

      return `<div class="detail-item" style="flex-direction:column;align-items:flex-start;gap:4px;padding:6px 0">
        <div style="display:flex;justify-content:space-between;width:100%">
          <span class="di-info">${r.verb} · ${r.tense}</span>
          <span class="di-res ${statusClass}">${statusText}</span>
        </div>
        ${personDetail}
      </div>`;
    }).join('');

    return `<div class="hist-card">
      <div class="hist-top">
        <div onclick="toggleDetail(${idx})" style="flex:1">
          <div style="font-weight:500;font-size:14px">${rec.date}</div>
          <div class="hist-detail">${modeStr && modeStr + ' · '}${tenseStr} · ${rec.total} 题</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="hist-score"><span style="font-size:12px;color:var(--muted);font-weight:400">${durationStr && durationStr + ' · '}</span>${pct}%<span style="font-size:12px;color:var(--muted);font-weight:400"> ${rec.correct}/${rec.total}</span></div>
          <button class="hist-delete" onclick="deleteHistory(${idx});event.stopPropagation()">删除</button>
        </div>
      </div>
      <div class="detail-panel" id="det-${idx}">${detailRows}</div>
    </div>`;
  }).join('');
}

function toggleDetail(idx){
  const el = document.getElementById('det-'+idx);
  el.classList.toggle('open');
}

function deleteHistory(idx){
  const history = JSON.parse(localStorage.getItem('frVerb_history')||'[]');
  history.splice(idx, 1);
  localStorage.setItem('frVerb_history', JSON.stringify(history));
  historyDirty = true;
  renderHistory();
  // Re-render mistake book only if it's currently visible
  if(document.getElementById('sub-mistakes').style.display !== 'none') renderMistakeBook();
  showToast('已删除');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

// ── Keyboard: navigation + Esc accent-bar ─────────────────────────────────────
let accentMode = false;
let accentIndex = 0;

function setAccentMode(on){
  accentMode = on;
  const btns = document.querySelectorAll('.accent-btn');
  if(!on){
    btns.forEach(b=>b.classList.remove('selected'));
    accentIndex = 0;
    return;
  }
  accentIndex = 0;
  btns.forEach((b,i)=>b.classList.toggle('selected', i===0));
  btns[0]?.scrollIntoView({block:'nearest'});
}

function insertAccentChar(){
  const btns = document.querySelectorAll('.accent-btn');
  const char = btns[accentIndex]?.dataset.accent;
  if(!char) return;
  const active = document.activeElement;
  if(active && (active.classList.contains('person-input')||active.classList.contains('participle-input'))){
    const s = active.selectionStart, e = active.selectionEnd;
    active.value = active.value.slice(0,s) + char + active.value.slice(e);
    active.selectionStart = active.selectionEnd = s + char.length;
  }
  setAccentMode(false);
}

// Grid layout: 2 columns, rows: [0,1],[2,3],[4,5]
const NAV_UP    = {0:null,1:null,2:0,3:1,4:2,5:3};
const NAV_DOWN  = {0:2,1:3,2:4,3:5,4:null,5:null};
const NAV_LEFT  = {0:null,1:0,2:null,3:2,4:null,5:4};
const NAV_RIGHT = {0:1,1:null,2:3,3:null,4:5,5:null};

document.addEventListener('keydown', e=>{
  const inInput = document.activeElement?.classList.contains('person-input') ||
                  document.activeElement?.classList.contains('participle-input');

  // ── Accent mode (Esc to toggle, arrows to move, Enter to insert) ──
  if(accentMode){
    if(e.key==='Escape'){e.preventDefault();setAccentMode(false);return;}
    if(e.key==='Enter'){e.preventDefault();insertAccentChar();return;}
    const btns = document.querySelectorAll('.accent-btn');
    const total = btns.length;
    if(e.key==='ArrowRight'){e.preventDefault();accentIndex=Math.min(accentIndex+1,total-1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();accentIndex=Math.max(accentIndex-1,0);}
    else if(e.key==='ArrowDown'){e.preventDefault();accentIndex=Math.min(accentIndex+7,total-1);}
    else if(e.key==='ArrowUp'){e.preventDefault();accentIndex=Math.max(accentIndex-7,0);}
    btns.forEach((b,i)=>b.classList.toggle('selected',i===accentIndex));
    btns[accentIndex]?.scrollIntoView({block:'nearest'});
    return;
  }

  if(!inInput) return;

  // ── Esc: enter accent mode ──
  if(e.key==='Escape'){
    const bar = document.getElementById('accent-bar');
    if(bar){e.preventDefault();setAccentMode(true);}
    return;
  }

  // ── Enter: check or advance ──
  if(e.key==='Enter'){
    e.preventDefault();
    if(!session.checked){
      checkAnswers();
    } else {
      nextQuestion();
    }
    return;
  }

  // ── Arrow keys: navigate between person inputs (not in participle mode) ──
  const isPP = document.querySelector('.participle-input');
  if(isPP) return;
  const cur = document.activeElement;
  const curIdx = parseInt(cur.id.replace('inp-',''));
  if(isNaN(curIdx)) return;

  let target = null;
  if(e.key==='ArrowUp')    target = NAV_UP[curIdx];
  else if(e.key==='ArrowDown')  target = NAV_DOWN[curIdx];
  else if(e.key==='ArrowLeft')  target = NAV_LEFT[curIdx];
  else if(e.key==='ArrowRight') target = NAV_RIGHT[curIdx];

  if(target !== null && target !== undefined){
    e.preventDefault();
    document.getElementById('inp-'+target)?.focus();
  }
});

document.addEventListener('mousedown', e => {
  const btn = e.target.closest('.accent-btn');
  if (btn) {
    e.preventDefault();
    const active = document.querySelector('.person-input:focus, .participle-input:focus') ||
                   document.querySelector('.person-input:not([disabled]), .participle-input:not([disabled])');
    if (active) {
      const c = btn.dataset.accent;
      const s = active.selectionStart, e2 = active.selectionEnd;
      active.value = active.value.slice(0, s) + c + active.value.slice(e2);
      active.selectionStart = active.selectionEnd = s + c.length;
      active.focus();
    }
  }
});

initChips();
initVerbs();
initModes();
</script>
