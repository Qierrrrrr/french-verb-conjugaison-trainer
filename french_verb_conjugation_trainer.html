
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#1a1a2e;--c2:#16213e;--c3:#0f3460;--acc:#e94560;--gold:#f5a623;--light:#f8f5f0;--muted:#8a8a9a;--card:#ffffff;--border:#e8e4df;--green:#2d9e6b;--red:#e94560}
body{font-family:'DM Sans',sans-serif;background:var(--light);color:var(--c1);min-height:100vh}
@media(prefers-color-scheme:dark){:root{--light:#141420;--card:#1e1e30;--border:#2e2e45;--c1:#f0eee8;--muted:#7a7a9a}}

.app{max-width:760px;margin:0 auto;padding:1.5rem 1rem}
.header{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.header h1{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;letter-spacing:-0.02em;color:var(--c1)}
.header p{font-size:13px;color:var(--muted);margin-top:4px;letter-spacing:.04em;text-transform:uppercase}

.tabs{display:flex;gap:2px;background:var(--border);padding:3px;border-radius:10px;margin-bottom:1.5rem}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;color:var(--muted);transition:all .2s}
.tab.active{background:var(--card);color:var(--c1);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.section-label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:.6rem}

.config-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
.config-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem}
.config-card .section-label{margin-bottom:.5rem}
.count-row{display:flex;align-items:center;gap:10px}
.count-row input[type=range]{flex:1}
.count-val{font-size:18px;font-weight:500;min-width:28px;text-align:right}

.tense-grid{display:flex;flex-wrap:wrap;gap:6px}
.tense-chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;color:var(--muted);background:var(--card);transition:all .2s;user-select:none}
.tense-chip.on{background:var(--c3);border-color:var(--c3);color:#fff}

.start-btn{width:100%;padding:14px;background:var(--c3);color:#fff;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.02em}
.start-btn:hover{background:var(--acc);transform:translateY(-1px)}

.progress-bar{background:var(--border);border-radius:4px;height:4px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--c3),var(--acc));border-radius:4px;transition:width .4s ease}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:.5rem}

.question-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1rem}
.verb-display{text-align:center;margin-bottom:1.5rem}
.verb-name{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:600;color:var(--c1);display:block}
.tense-badge{display:inline-block;background:var(--c3);color:#fff;font-size:11px;padding:3px 12px;border-radius:20px;letter-spacing:.06em;text-transform:uppercase;margin-top:.4rem}

.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person-row{display:flex;align-items:center;gap:8px;background:var(--light);border-radius:10px;padding:8px 10px}
.person-label{font-size:12px;font-weight:500;color:var(--muted);min-width:36px;letter-spacing:.04em;text-transform:uppercase}
.person-input{flex:1;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--c1);outline:none}
.person-input::placeholder{color:#bbb}
.person-row.correct{background:#f0faf5;border:1px solid #b7dfd0}
.person-row.wrong{background:#fff5f5;border:1px solid #f5c0c0}
.person-row.correct .person-label{color:var(--green)}
.person-row.wrong .person-label{color:var(--red)}
.answer-hint{font-size:12px;color:var(--green);margin-top:2px;display:none}
.person-row.wrong .answer-hint{display:block;color:var(--red)}

.action-row{display:flex;gap:10px;margin-top:1rem}
.check-btn{flex:1;padding:12px;background:var(--c1);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.check-btn:hover{background:var(--c3)}
.check-icon{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:10px}
.skip-btn{padding:12px 16px;background:transparent;border:1px solid var(--border);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;transition:all .2s}
.skip-btn:hover{border-color:var(--c3);color:var(--c3)}

.nav-btn{flex:1;padding:12px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s}
.nav-next{background:var(--acc);color:#fff;border:none}
.nav-next:hover{background:#d63a53}

.result-screen{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center}
.result-score{font-family:'Playfair Display',serif;font-size:3.5rem;font-weight:600;color:var(--c3);line-height:1}
.result-label{font-size:13px;color:var(--muted);margin-top:.3rem;letter-spacing:.04em;text-transform:uppercase}
.result-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:1.5rem 0}
.stat-card{background:var(--light);border-radius:10px;padding:1rem;text-align:center}
.stat-val{font-size:1.4rem;font-weight:500;color:var(--c1)}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em;text-transform:uppercase}
.save-btn{padding:12px 28px;background:var(--gold);color:var(--c1);border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin:0 6px;transition:all .2s}
.save-btn:hover{transform:translateY(-1px)}
.again-btn{padding:12px 28px;background:var(--c3);color:#fff;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin:0 6px;transition:all .2s}
.again-btn:hover{background:var(--acc)}

.history-list{display:flex;flex-direction:column;gap:10px}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;cursor:pointer;transition:all .2s}
.hist-card:hover{border-color:var(--c3)}
.hist-top{display:flex;justify-content:space-between;align-items:center}
.hist-date{font-size:12px;color:var(--muted)}
.hist-score{font-size:18px;font-weight:500;color:var(--c3)}
.hist-detail{margin-top:.6rem;font-size:12px;color:var(--muted)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted);font-size:14px}

.detail-panel{background:var(--light);border-radius:10px;padding:1rem;margin-top:.8rem;display:none;font-size:12px}
.detail-panel.open{display:block}
.detail-item{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border)}
.detail-item:last-child{border:none}
.di-info{color:var(--muted)}
.di-res{font-weight:500}
.di-res.ok{color:var(--green)}
.di-res.err{color:var(--red)}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(60px);background:var(--c1);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:all .4s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<div class="app">
<div class="header">
  <h1>Conjugaison française</h1>
  <p>Entraînement aux conjugaisons</p>
</div>

<div class="tabs">

    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
    <div id="question-area"></div>
  </div>

  <div id="result-screen" style="display:none"></div>
</div>

<div id="tab-history" style="display:none">
  <div class="history-list" id="history-list"></div>
</div>
</div>

<div class="toast" id="toast"></div>

let activeTenses = new Set(['Présent','Imparfait','Conditionnel']);
let session = {questions:[], current:0, checked:false, results:[]};

function switchTab(t){
  document.querySelectorAll('.tab').forEach((el,i)=>{el.classList.toggle('active',['practice','history'][i]===t)});
  document.getElementById('tab-practice').style.display = t==='practice'?'':'none';
  document.getElementById('tab-history').style.display = t==='history'?'':'none';
  if(t==='history') renderHistory();
}

function initChips(){
  const c = document.getElementById('tense-chips');
  TENSES.forEach(t=>{
    const el = document.createElement('div');
    el.className = 'tense-chip'+(activeTenses.has(t)?' on':'');
    el.textContent = TENSE_SHORT[t]||t;
    el.title = t;
    el.onclick = ()=>{
      if(activeTenses.has(t)){if(activeTenses.size>1)activeTenses.delete(t);}
      else activeTenses.add(t);
      el.classList.toggle('on', activeTenses.has(t));
    };
    c.appendChild(el);
  });
}

function buildPool(){
  const pool = [];
  Object.keys(DB).forEach(verb=>{
    activeTenses.forEach(tense=>{
      if(DB[verb][tense]){
        const forms = DB[verb][tense];
        if(forms.some(f=>f)) pool.push({verb, tense, forms});
      }
    });
  });
  return pool;
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startSession(){
  const n = parseInt(document.getElementById('count-slider').value);
  const pool = shuffle(buildPool()).slice(0, n);
  if(!pool.length){showToast('请至少选择一个时态！');return;}
  session = {questions:pool, current:0, checked:false, results:[]};
  document.getElementById('config-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='';
  document.getElementById('result-screen').style.display='none';
  renderQuestion();
}

function renderQuestion(){
  const q = session.questions[session.current];
  const total = session.questions.length;
  const pct = Math.round(session.current/total*100);
  document.getElementById('prog-label').textContent = `第 ${session.current+1} 题，共 ${total} 题`;
  document.getElementById('prog-pct').textContent = pct+'%';
  document.getElementById('prog-fill').style.width = pct+'%';
  session.checked = false;

  const isPP = (q.tense==='Participe passé'||q.tense==='Participe présent');
  const activePersons = isPP ? [0] : [0,1,2,3,4,5];

  let rows = activePersons.map(i=>`
    <div class="person-row" id="row-${i}">
      <span class="person-label">${PERSONS[i]}</span>
      <input class="person-input" id="inp-${i}" placeholder="..." autocomplete="off" autocorrect="off" spellcheck="false">
      <span class="answer-hint" id="hint-${i}"></span>
    </div>`).join('');

  document.getElementById('question-area').innerHTML = `
    <div class="question-card">
      <div class="verb-display">
        <span class="verb-name">${q.verb}</span>
        <span class="tense-badge">${q.tense}</span>
      </div>
      <div class="person-grid">${rows}</div>
      <div class="action-row">
        <button class="check-btn" onclick="checkAnswers()">
          <span class="check-icon">✓</span> 核对答案
        </button>
        <button class="skip-btn" onclick="nextQuestion()">跳过 →</button>
      </div>
    </div>`;
  document.getElementById('inp-0')?.focus();
}

function normalize(s){return (s||'').trim().toLowerCase();}

function checkAnswers(){
  const q = session.questions[session.current];
  const isPP = (q.tense==='Participe passé'||q.tense==='Participe présent');
  const activePersons = isPP ? [0] : [0,1,2,3,4,5];
  let allRight = true;
  const personResults = [];

  activePersons.forEach(i=>{
    const inp = document.getElementById('inp-'+i);
    const row = document.getElementById('row-'+i);
    const hint = document.getElementById('hint-'+i);
    const expected = q.forms[i];
    if(!expected){row.classList.remove('correct','wrong');personResults.push({i,ok:true,ans:''});return;}
    const val = inp?inp.value:'';
    const ok = normalize(val)===normalize(expected);
    row.classList.toggle('correct',ok);
    row.classList.toggle('wrong',!ok);
    if(hint) hint.textContent = ok ? '' : `✗ 正确答案：${expected}`;
    if(!ok) allRight = false;
    personResults.push({i, ok, userAns:val, correct:expected, person:PERSONS[i]});
  });

  session.checked = true;

  const actionRow = document.querySelector('.action-row');
  actionRow.innerHTML = `
    <button class="nav-btn nav-next" onclick="nextQuestion()">
      ${session.current+1 < session.questions.length ? '下一题 →' : '查看结果 →'}
    </button>`;

  if(allRight) showToast('全部正确！');
  session.results[session.current] = {verb:q.verb, tense:q.tense, allRight, personResults};
}

function nextQuestion(){
  if(!session.checked){
    const q = session.questions[session.current];
    session.results[session.current] = {verb:q.verb, tense:q.tense, allRight:false, skipped:true};
  }
  session.current++;
  if(session.current >= session.questions.length){showResult();return;}
  renderQuestion();
}

function showResult(){
  document.getElementById('quiz-screen').style.display='none';
  const rs = document.getElementById('result-screen');
  rs.style.display='';
  const correct = session.results.filter(r=>r&&r.allRight).length;
  const total = session.questions.length;
  const pct = Math.round(correct/total*100);
  rs.innerHTML = `
    <div class="result-screen">
      <div class="result-score">${pct}%</div>
      <div class="result-label">正确率</div>
      <div class="result-stats">
        <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-lbl">总题数</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--green)">${correct}</div><div class="stat-lbl">全对</div></div>
        <div class="stat-card"><div class="stat-val" style="color:var(--red)">${total-correct}</div><div class="stat-lbl">出错</div></div>
      </div>
      <div>
        <button class="save-btn" onclick="saveSession()">保存本次练习</button>
        <button class="again-btn" onclick="resetToConfig()">再练一次</button>
      </div>
    </div>`;
}

function saveSession(){
  const history = JSON.parse(localStorage.getItem('frVerb_history')||'[]');
  const rec = {
    date: new Date().toLocaleString('zh-CN',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}),
    ts: Date.now(),
    total: session.questions.length,
    correct: session.results.filter(r=>r&&r.allRight).length,
    tenses: [...activeTenses],
    results: session.results
  };
  history.unshift(rec);
  localStorage.setItem('frVerb_history', JSON.stringify(history.slice(0,50)));
  showToast('已保存！');
}

function resetToConfig(){
  document.getElementById('config-screen').style.display='';
  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='none';
}

function renderHistory(){
  const list = document.getElementById('history-list');
  const history = JSON.parse(localStorage.getItem('frVerb_history')||'[]');
  if(!history.length){list.innerHTML='<div class="empty-state">暂无练习记录</div>';return;}
  list.innerHTML = history.map((rec,idx)=>{
    const pct = Math.round(rec.correct/rec.total*100);
    const tenseStr = (rec.tenses||[]).map(t=>TENSE_SHORT[t]||t).join('、');
    return `<div class="hist-card" onclick="toggleDetail(${idx})">
      <div class="hist-top">
        <div>
          <div style="font-weight:500;font-size:14px">${rec.date}</div>
          <div class="hist-detail">${tenseStr} · ${rec.total} 题</div>
        </div>
        <div class="hist-score">${pct}%<span style="font-size:12px;color:var(--muted);font-weight:400"> ${rec.correct}/${rec.total}</span></div>
      </div>
      <div class="detail-panel" id="det-${idx}">
        ${(rec.results||[]).filter(Boolean).map(r=>`
          <div class="detail-item">
            <span class="di-info">${r.verb} · ${r.tense}</span>
            <span class="di-res ${r.allRight?'ok':'err'}">${r.allRight?'✓ 全对':r.skipped?'跳过':'✗ 出错'}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleDetail(idx){
  const el = document.getElementById('det-'+idx);
  el.classList.toggle('open');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2000);
}

initChips();
</script>
